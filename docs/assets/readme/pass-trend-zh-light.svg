<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc" font-family="Charter, Georgia, 'Times New Roman', STSong, 'Songti SC', 'Noto Serif CJK SC', serif">
<title id="title">同一批 10 题的完整交付</title>
<desc id="desc">同一模型 · 各测 1 次 · 只统计完整交出产物的题数</desc>
